[project]
name = "chess-persona"
version = "0.1.0"
description = "A chess transformer with an exact, hand-compiled DeltaNet board and per-player style adapters"
authors = [{ name = "Aditya Shrivastava" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "modal>=1.6.3",
    "numpy>=2.5.4",
    "python-chess>=1.999",
    "requests>=2.34.2",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess_persona"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
